<div class="page-head">
  <div><h1 class="page-title">Business Settings</h1><p class="text-secondary">Configure your cart, receipts and inventory rules</p></div>
  @if (isAdmin) { <a class="btn btn-secondary" routerLink="/settings/users"><app-icon name="users" [size]="18"></app-icon> Users & Roles</a> }
</div>

@if (loading()) { <app-loading></app-loading> }
@else {
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="card card-pad mb-16">
      <h3 class="section-title mb-16">Business Profile</h3>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Business Name *</label><input class="form-control" formControlName="businessName"/></div>
        <div class="form-group"><label class="form-label">Mobile</label><input class="form-control" formControlName="mobileNumber"/></div>
      </div>
      <div class="form-group"><label class="form-label">Address</label><input class="form-control" formControlName="address"/></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">GST Number</label><input class="form-control" formControlName="gstNumber"/></div>
        <div class="form-group"><label class="form-label">FSSAI Number</label><input class="form-control" formControlName="fssaiNumber"/></div>
      </div>
      <div class="form-group"><label class="form-label">Receipt Footer</label><input class="form-control" formControlName="receiptFooter"/></div>
    </div>

    <div class="card card-pad mb-16">
      <h3 class="section-title mb-16">Order & Pricing Defaults</h3>
      <div class="grid-3">
        <div class="form-group"><label class="form-label">Currency Symbol *</label><input class="form-control" formControlName="currencySymbol"/></div>
        <div class="form-group"><label class="form-label">Default Tax %</label><input class="form-control" type="number" step="0.01" formControlName="defaultTaxPercent"/></div>
        <div class="form-group"><label class="form-label">Default Order Type</label>
          <select class="form-control" formControlName="defaultOrderType">
            <option value="DineIn">Dine-in</option><option value="Takeaway">Takeaway</option><option value="Parcel">Parcel</option>
          </select></div>
      </div>
    </div>

    <div class="card card-pad mb-16">
      <h3 class="section-title mb-16">Inventory Rules</h3>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Low Stock Threshold (global)</label><input class="form-control" type="number" step="0.001" formControlName="lowStockThreshold"/></div>
        <div class="form-group"><label class="form-label">Deduct Inventory When Order Is</label>
          <select class="form-control" formControlName="deductionTrigger">
            <option value="OnCompleted">Completed</option><option value="OnPreparing">Preparing</option>
          </select></div>
      </div>
      <label class="tg"><input type="checkbox" formControlName="allowNegativeStock"/> Allow stock to go negative</label>
    </div>

    @if (isAdmin) {
      <div class="flex" style="justify-content:flex-end">
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          @if (saving()) { <app-spinner [size]="16"></app-spinner> } @else { Save Settings }
        </button>
      </div>
    } @else { <p class="text-secondary">Only an Admin can change business settings.</p> }
  </form>
}

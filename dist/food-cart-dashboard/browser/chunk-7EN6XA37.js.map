<div class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <span class="logo"><app-icon name="food" [size]="26"></app-icon></span>
      <div>
        <h1>Food Cart</h1>
        <p class="text-secondary">Management System</p>
      </div>
    </div>

    <h2 class="welcome">Sign in to your counter</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      @if (error()) { <div class="alert">{{ error() }}</div> }

      <div class="form-group">
        <label class="form-label">Email / Username</label>
        <input class="form-control" formControlName="usernameOrEmail" autocomplete="username"
          [class.invalid]="form.controls.usernameOrEmail.touched && form.controls.usernameOrEmail.invalid" />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input class="form-control" type="password" formControlName="password" autocomplete="current-password"
          [class.invalid]="form.controls.password.touched && form.controls.password.invalid" />
      </div>

      <label class="remember">
        <input type="checkbox" formControlName="rememberMe" /> Remember me
      </label>

      <button class="btn btn-primary btn-block btn-lg" type="submit" [disabled]="loading()">
        @if (loading()) { <app-spinner [size]="18"></app-spinner> } @else { Login }
      </button>
    </form>

    <div class="demo">
      <span class="text-secondary text-small">Demo accounts — tap to fill:</span>
      <div class="chips">
        @for (a of demoAccounts; track a.role) {
          <button class="chip" type="button" (click)="fill(a.user, a.pass)">{{ a.role }}</button>
        }
      </div>
    </div>
  </div>
</div>

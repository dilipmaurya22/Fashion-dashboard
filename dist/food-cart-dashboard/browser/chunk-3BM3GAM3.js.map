<div class="shell">
  <!-- Sidebar -->
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <div class="brand">
      <span class="logo"><app-icon name="food" [size]="22"></app-icon></span>
      <span class="brand-name">Food Cart</span>
    </div>

    <nav class="nav">
      @for (group of visibleGroups(); track group.title) {
        <div class="nav-group">
          <div class="nav-title">{{ group.title }}</div>
          @for (item of group.items; track item.route) {
            <a class="nav-item" [routerLink]="item.route" routerLinkActive="active">
              <app-icon [name]="item.icon" [size]="18"></app-icon>
              <span>{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </nav>
  </aside>

  @if (sidebarOpen()) { <div class="backdrop" (click)="toggleSidebar()"></div> }

  <!-- Main -->
  <div class="main">
    <header class="header">
      <button class="icon-btn menu-btn" (click)="toggleSidebar()"><app-icon name="menu"></app-icon></button>

      <div class="search">
        <app-icon name="search" [size]="18"></app-icon>
        <input type="text" placeholder="Search orders, food, customers…" />
      </div>

      <div class="spacer"></div>

      <div class="datetime">{{ now() | date:'EEE, dd MMM • h:mm a' }}</div>

      <button class="icon-btn" (click)="theme.toggle()" title="Toggle theme">
        <app-icon [name]="theme.dark() ? 'sun' : 'moon'"></app-icon>
      </button>
      <button class="icon-btn" title="Notifications"><app-icon name="bell"></app-icon></button>

      <div class="profile">
        <div class="avatar">{{ initials() }}</div>
        <div class="who">
          <div class="name">{{ auth.user()?.fullName }}</div>
          <div class="role">{{ auth.user()?.role }}</div>
        </div>
        <button class="icon-btn" (click)="logout()" title="Logout"><app-icon name="logout" [size]="18"></app-icon></button>
      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
